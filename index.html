<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>日记</title>
  <style>
    :root {
      --bg: #0a0f1a;
      --grass: #0b1e0b;
      --text: #f0f8ff;
      --paper: #f7f0e0;
      --paper-dark: #ebe2d0;
      --ink: #2c2416;
      --accent: #d4a5ff;
      --accent-dark: #a078d0;
      --spine: #8b6914;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      background: linear-gradient(to bottom, var(--grass) 30%, var(--bg) 70%);
      color: var(--text);
      font-family: "Songti SC", "SimSun", "STSong", "Noto Serif SC", serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      user-select: none;
    }

    canvas#fireflies {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* 开场欢迎页 */
    #welcome {
      position: relative;
      z-index: 20;
      text-align: center;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    #welcome h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      letter-spacing: 0.2em;
      color: #f0e6d0;
      margin-bottom: 0.5rem;
    }

    #welcome p {
      font-size: 1.1rem;
      color: rgba(240,248,255,0.7);
      letter-spacing: 0.1em;
    }

    .open-btn {
      padding: 1rem 2.8rem;
      font-size: 1.25rem;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(160,120,208,0.45);
      transition: all 0.35s;
      font-family: system-ui, sans-serif;
      letter-spacing: 0.08em;
    }

    .open-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(160,120,208,0.65);
    }

    .open-btn:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    /* 书本区域 - 更大尺寸，更好纸张质感 */
    .book-wrapper {
      position: relative;
      z-index: 10;
      width: min(96vw, 1100px);
      height: min(86vh, 780px);
      perspective: 2800px;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .book {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
    }

    .page {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
      cursor: pointer;
    }

    .page .front,
    .page .back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 0 8px 8px 0;
      overflow: hidden;
      box-shadow:
        2px 0 8px rgba(0,0,0,0.12),
        0 6px 28px rgba(0,0,0,0.28);
    }

    /* 正面纸张：暖色宣纸感 + 细微纹理 */
    .page .front {
      background:
        linear-gradient(90deg, rgba(180,150,100,0.18) 0%, transparent 12px),
        linear-gradient(180deg, #faf6eb 0%, #f5efe0 40%, #f0e8d4 100%);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      padding: 2.2rem 1.9rem 1.6rem 2.4rem;
      background-blend-mode: multiply;
      position: relative;
    }

    .page .front::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.7;
    }

    /* 背面纸张：稍深一点，更有对页层次 */
    .page .back {
      background:
        linear-gradient(270deg, rgba(180,150,100,0.18) 0%, transparent 12px),
        linear-gradient(180deg, #f3ece0 0%, #ebe3d2 40%, #e6dcc8 100%);
      color: var(--ink);
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      padding: 2.2rem 2.4rem 1.6rem 1.9rem;
      position: relative;
    }

    .page .back::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.7;
    }

    /* 封面：更深的皮质/布面质感 */
    .page.cover .front,
    .page.cover .back {
      background:
        linear-gradient(145deg, #2e2218 0%, #4a3728 35%, #3a2a1c 70%, #2a1e14 100%);
      color: #f5e6c8;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 3px solid #9a7b3c;
      box-shadow:
        inset 0 0 40px rgba(0,0,0,0.35),
        0 8px 32px rgba(0,0,0,0.4);
    }

    .page.cover .front::before,
    .page.cover .back::before {
      opacity: 0.15;
    }

    .cover-title {
      font-size: clamp(2rem, 5vw, 3.2rem);
      letter-spacing: 0.35em;
      margin-bottom: 1.4rem;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      height: 58%;
      display: flex;
      align-items: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .cover-sub {
      font-size: 1.1rem;
      opacity: 0.88;
      letter-spacing: 0.15em;
      margin-top: 1rem;
    }

    .page-content {
      flex: 1;
      overflow-y: auto;
      font-size: clamp(1.05rem, 2.3vw, 1.28rem);
      line-height: 2.05;
      text-align: justify;
      letter-spacing: 0.05em;
      white-space: pre-wrap;
      position: relative;
      z-index: 1;
    }

    .page-content p {
      margin-bottom: 1em;
      text-indent: 2em;
    }

    .page-footer {
      margin-top: 1rem;
      font-size: 0.9rem;
      opacity: 0.6;
      text-align: center;
      letter-spacing: 0.12em;
      position: relative;
      z-index: 1;
    }

    /* 书脊阴影更立体 */
    .book::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 22px;
      height: 100%;
      transform: translateX(-50%);
      background: linear-gradient(90deg,
        rgba(0,0,0,0.32) 0%,
        rgba(0,0,0,0.1) 35%,
        rgba(0,0,0,0.06) 50%,
        rgba(0,0,0,0.12) 65%,
        rgba(0,0,0,0.28) 100%);
      z-index: 100;
      pointer-events: none;
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(0,0,0,0.15);
    }

    .controls {
      position: relative;
      z-index: 20;
      margin-top: 1.6rem;
      display: none;
      gap: 1.5rem;
      align-items: center;
    }

    .ctrl-btn {
      padding: 0.7rem 1.8rem;
      font-size: 1.05rem;
      color: white;
      background: linear-gradient(135deg, #a078d0, #7a5aa8);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(160,120,208,0.35);
      transition: all 0.3s;
      font-family: system-ui, sans-serif;
    }

    .ctrl-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 26px rgba(160,120,208,0.55);
    }

    .ctrl-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .page-indicator {
      font-size: 1rem;
      color: #c9b8e8;
      min-width: 90px;
      text-align: center;
      font-family: system-ui, sans-serif;
    }

    .hint {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      font-size: 0.85rem;
      color: rgba(240,248,255,0.55);
      font-family: system-ui, sans-serif;
      letter-spacing: 0.08em;
      display: none;
    }

    .loading {
      position: relative;
      z-index: 20;
      color: #c9b8e8;
      font-size: 1.2rem;
      font-family: system-ui, sans-serif;
    }

    @media (max-width: 640px) {
      .book-wrapper {
        width: min(96vw, 100%);
        height: min(80vh, 640px);
      }
      .page .front {
        padding: 1.5rem 1.2rem 1.2rem 1.5rem;
      }
      .page .back {
        padding: 1.5rem 1.5rem 1.2rem 1.2rem;
      }
      .page-content {
        font-size: 1rem;
        line-height: 1.95;
      }
      .controls {
        gap: 0.8rem;
      }
      .ctrl-btn {
        padding: 0.6rem 1.3rem;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="fireflies"></canvas>

  <!-- 欢迎页：点击后才打开日记 -->
  <div id="welcome">
    <h1>日记</h1>
    <p>轻轻打开，翻阅一页心事</p>
    <button class="open-btn" id="openDiaryBtn">打开日记</button>
  </div>

  <div class="book-wrapper" id="bookWrapper">
    <div class="book" id="book">
      <div class="loading" id="loading">正在加载日记...</div>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="ctrl-btn" id="prevBtn">上一页</button>
    <div class="page-indicator" id="pageIndicator">1 / 1</div>
    <button class="ctrl-btn" id="nextBtn">下一页</button>
  </div>

  <div class="hint" id="hint">点击页面右侧或按钮翻页 · 可左右滑动</div>

  <script>
    // ===================== 萤火虫 =====================
    const canvas = document.getElementById('fireflies');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    class Firefly {
      constructor(isBackground = false) {
        this.isBackground = isBackground;
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height * (this.isBackground ? 0.12 : 0.55) + Math.random() * canvas.height * (this.isBackground ? 0.75 : 0.4);
        this.size = Math.random() * 2.6 + 1.1;
        this.speed = Math.random() * 0.45 + 0.12;
        this.angle = Math.random() * Math.PI * 2;
        this.hue = 48 + Math.random() * 28;
        this.alpha = Math.random() * 0.38 + 0.14;
        this.phase = Math.random() * Math.PI * 2;
      }
      update() {
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.angle += (Math.random() - 0.5) * 0.03;
        if (this.x < 0) this.x += canvas.width;
        if (this.x > canvas.width) this.x -= canvas.width;
        if (this.y < 0) this.y += canvas.height;
        if (this.y > canvas.height) this.y -= canvas.height;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = `hsl(${this.hue}, 100%, ${72 + Math.sin(Date.now() * 0.001 + this.phase) * 12}%)`;
        ctx.shadowBlur = this.isBackground ? 9 : 18;
        ctx.shadowColor = '#c4b5fd';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    const fireflies = [];
    for (let i = 0; i < 180; i++) fireflies.push(new Firefly(false));
    for (let i = 0; i < 80; i++) fireflies.push(new Firefly(true));

    function animateFireflies() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fireflies.forEach(f => { f.update(); f.draw(); });
      requestAnimationFrame(animateFireflies);
    }
    animateFireflies();

    // ===================== 发送邮箱通知（和原来生日贺卡一样） =====================
    let hasSentOpenNotice = false;

    function postToMailbox(payload) {
      return fetch('https://eot2mpox4zshyec.m.pipedream.net', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({
          ...payload,
          date: new Date().toLocaleString('zh-CN'),
          ua: navigator.userAgent,
          page: location.href
        })
      });
    }

    function sendOpenNotice() {
      if (hasSentOpenNotice) return Promise.resolve();
      hasSentOpenNotice = true;
      return postToMailbox({
        event: 'open_diary_click',
        message: '用户点击了「打开日记」按钮'
      });
    }

    // ===================== 从文本文件加载日记 =====================
    function parseDiaryText(text) {
      const sections = [];
      const regex = /【([^】]+)】\s*([\s\S]*?)(?=【|$)/g;
      let match;

      while ((match = regex.exec(text)) !== null) {
        const title = match[1].trim();
        const content = match[2].trim();
        sections.push({ title, content });
      }

      const pagesData = [];
      for (let i = 0; i < sections.length; i += 2) {
        const frontSec = sections[i];
        const backSec = sections[i + 1] || { title: '', content: '' };

        const isCover = frontSec.title.includes('封面') || frontSec.title.includes('封底');

        let frontHtml = '';
        let backHtml = '';

        if (isCover) {
          const lines = frontSec.content.split('\n').map(l => l.trim()).filter(Boolean);
          frontHtml = `
            <div class="cover-title">${lines[0] || frontSec.title}</div>
            ${lines.slice(1).map(l => `<div class="cover-sub">${l}</div>`).join('')}
          `;
          const backLines = backSec.content.split('\n').map(l => l.trim()).filter(Boolean);
          backHtml = backLines.map(l => `<div style="margin:0.6em 0;font-size:1.05rem;">${l}</div>`).join('');
        } else {
          frontHtml = `
            <div class="page-content">${formatContent(frontSec.content)}</div>
            <div class="page-footer">${frontSec.title.replace(/第|页/g, '') || ''}</div>
          `;
          backHtml = `
            <div class="page-content">${formatContent(backSec.content)}</div>
            <div class="page-footer">${backSec.title.replace(/第|页/g, '') || ''}</div>
          `;
        }

        pagesData.push({
          isCover,
          front: frontHtml,
          back: backHtml
        });
      }

      return pagesData;
    }

    function formatContent(text) {
      return text
        .split(/\n\s*\n/)
        .map(para => para.trim())
        .filter(Boolean)
        .map(para => {
          const lines = para.split('\n').map(l => l.trim()).filter(Boolean);
          if (lines.length > 1 && lines.every(l => l.length < 20)) {
            return lines.map(l => `<p style="text-indent:0;text-align:center;margin:0.4em 0;">${l}</p>`).join('');
          }
          return `<p>${para.replace(/\n/g, '<br>')}</p>`;
        })
        .join('');
    }

    // ===================== 翻书逻辑 =====================
    let pagesData = [];
    let currentPage = 0;
    let totalLeaves = 0;
    const book = document.getElementById('book');

    function createPages() {
      book.innerHTML = '';
      pagesData.forEach((data, index) => {
        const page = document.createElement('div');
        page.className = 'page' + (data.isCover ? ' cover' : '');
        page.dataset.index = index;
        page.style.zIndex = totalLeaves - index;

        page.innerHTML = `
          <div class="front">${data.front}</div>
          <div class="back">${data.back}</div>
        `;

        page.addEventListener('click', (e) => {
          const rect = page.getBoundingClientRect();
          const x = e.clientX - rect.left;
          if (x > rect.width * 0.45) nextPage();
          else prevPage();
        });

        book.appendChild(page);
      });
      updateUI();
      document.getElementById('controls').style.display = 'flex';
      document.getElementById('hint').style.display = 'block';
    }

    function flipTo(index) {
      if (index < 0 || index > totalLeaves) return;
      currentPage = index;
      const pages = book.querySelectorAll('.page');
      pages.forEach((page, i) => {
        if (i < currentPage) {
          page.style.transform = 'rotateY(-180deg)';
          page.style.zIndex = i + 1;
        } else {
          page.style.transform = 'rotateY(0deg)';
          page.style.zIndex = totalLeaves - i;
        }
      });
      updateUI();
    }

    function nextPage() {
      if (currentPage < totalLeaves) flipTo(currentPage + 1);
    }

    function prevPage() {
      if (currentPage > 0) flipTo(currentPage - 1);
    }

    function updateUI() {
      const indicator = document.getElementById('pageIndicator');
      indicator.textContent = `${Math.min(currentPage + 1, totalLeaves)} / ${totalLeaves}`;
      document.getElementById('prevBtn').disabled = currentPage <= 0;
      document.getElementById('nextBtn').disabled = currentPage >= totalLeaves;
    }

    document.getElementById('prevBtn').addEventListener('click', prevPage);
    document.getElementById('nextBtn').addEventListener('click', nextPage);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextPage();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevPage();
      }
    });

    let touchStartX = 0;
    book.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    book.addEventListener('touchend', (e) => {
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) nextPage();
        else prevPage();
      }
    }, { passive: true });

    // ===================== 加载日记 =====================
    async function loadDiary() {
      try {
        const response = await fetch('diary.txt');
        if (!response.ok) throw new Error('无法读取 diary.txt');
        const text = await response.text();
        pagesData = parseDiaryText(text);
        totalLeaves = pagesData.length;

        if (totalLeaves === 0) {
          document.getElementById('loading').textContent = '日记内容为空，请检查 diary.txt';
          return;
        }

        createPages();
      } catch (err) {
        console.error(err);
        document.getElementById('loading').innerHTML = `
          <div style="text-align:center;padding:2rem;color:#f5e6c8;">
            <p style="margin-bottom:1rem;">无法加载 diary.txt</p>
            <p style="font-size:0.9rem;opacity:0.8;line-height:1.6;">
              请确保 diary.txt 和 index.html 在同一文件夹，<br>
              并使用本地服务器打开（推荐 Live Server 或 python -m http.server）
            </p>
          </div>
        `;
      }
    }

    // 点击「打开日记」
    document.getElementById('openDiaryBtn').addEventListener('click', async function() {
      const btn = this;
      btn.disabled = true;
      btn.textContent = '正在打开...';

      // 1. 先发送邮箱通知（和原来生日贺卡一样）
      try {
        await sendOpenNotice();
      } catch (e) {
        console.log('通知发送失败', e);
      }

      // 2. 隐藏欢迎页，显示书本
      document.getElementById('welcome').style.display = 'none';
      document.getElementById('bookWrapper').style.display = 'flex';

      // 3. 加载日记内容
      await loadDiary();
    });
  </script>
</body>
</html>
