<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>一份致宁小倩の生日贺卡</title>
  <style>
    :root {
      --bg: #0a0f1a;
      --grass: #0b1e0b;
      --text: #f0f8ff;
      --accent: #d4a5ff;
      --accent-dark: #a078d0;
    }
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to bottom, var(--grass) 35%, var(--bg) 70%);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    canvas#fireflies {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .main-content {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 900px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 60vh;
      opacity: 0;
      transition: opacity 2.2s ease 1.8s;
    }
    .main-content.visible {
      opacity: 1;
    }
    #stage {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      line-height: 1.7;
      white-space: pre-wrap;
      opacity: 0;
      transform: translateY(46px);
      transition: opacity 2.1s ease-out, transform 2.4s ease-out;
    }
    #stage.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .buttons {
      margin-top: 2.5rem;
      display: flex;
      justify-content: center;
      gap: 1.8rem;
      flex-wrap: wrap;
    }
    .btn {
      padding: 0.95rem 2.4rem;
      font-size: 1.22rem;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 7px 22px rgba(160,120,208,0.4);
      transition: all 0.35s;
    }
    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 35px rgba(160,120,208,0.65);
    }

    #photo-gallery {
      display: none;
      width: 100%;
      max-width: 900px;
      margin: 2rem auto;
      padding: 1rem;
      flex-direction: column;
      align-items: center;
    }
    #photo-container {
      position: relative;
      width: 100%;
      height: 70vh;
      max-height: 620px;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      background: rgba(0,0,0,0.3);
    }
    #photo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    #photo-container img.active {
      opacity: 1;
    }

    .photo-controls {
      margin: 2rem 0;
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: nowrap;
      width: 100%;
      max-width: 420px;
    }

    .photo-btn {
      padding: 0.7rem 1.4rem;
      font-size: clamp(0.95rem, 3.5vw, 1.1rem);
      min-width: 90px;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(160,120,208,0.4);
      transition: all 0.3s;
      white-space: nowrap;
    }

    .photo-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(160,120,208,0.6);
    }

    @media (max-width: 480px) {
      .photo-controls {
        gap: 0.7rem;
        padding: 0 0.5rem;
      }
      .photo-btn {
        padding: 0.65rem 1.1rem;
        font-size: clamp(0.9rem, 4vw, 1rem);
        min-width: 80px;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<canvas id="fireflies"></canvas>

<div class="main-content" id="mainContent">
  <div id="stage"></div>
  <div class="buttons" id="buttons"></div>

  <div id="finish" style="display:none; text-align:center; padding:2rem; max-width:90%;"></div>

  <div id="photo-gallery">
    <div id="photo-container"></div>
    <div class="photo-controls">
      <button class="photo-btn" id="prev-photo">上一张</button>
      <button class="photo-btn" id="toggle-play">暂停</button>
      <button class="photo-btn" id="next-photo">下一张</button>
    </div>
    <button class="btn" id="back-to-finish" style="background:linear-gradient(135deg, #6b7280, #4b5563); margin-top:1.5rem;">
      返回祝福页
    </button>
  </div>
</div>

<audio id="bgm" loop preload="auto">
  <source src="birthday-music.mp3" type="audio/mpeg">
</audio>

<audio id="bgm2" loop preload="auto">
  <source src="music2.mp3" type="audio/mpeg">
</audio>

<script>
// ===================== 萤火虫部分（保持原样） =====================
const canvas = document.getElementById('fireflies');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

class Firefly {
  constructor(isBackground = false) {
    this.isBackground = isBackground;
    this.reset();
    this.transitionStart = 0;
    this.transitionProgress = 0;
  }

  reset() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height * (this.isBackground ? 0.15 : 0.6) + Math.random() * canvas.height * (this.isBackground ? 0.7 : 0.4);
    this.size = Math.random() * 2.8 + 1.2;
    this.speed = Math.random() * 0.5 + 0.15;
    this.angle = Math.random() * Math.PI * 2;
    this.hue = 50 + Math.random() * 30;
    this.alpha = Math.random() * 0.4 + 0.15;
    this.phase = Math.random() * Math.PI * 2;
    this.target = null;
    this.transitionStart = 0;
    this.transitionProgress = 0;
  }

  startStarTransition() {
    this.transitionStart = performance.now();
    this.transitionProgress = 0;
  }

  update(targets) {
    const now = performance.now();
    if (this.transitionStart > 0) {
      const elapsed = now - this.transitionStart;
      this.transitionProgress = Math.min(elapsed / 1800, 1);
    }
    const p = this.transitionProgress;

    if (p === 0 && !this.isBackground && targets.length > 0) {
      if (!this.target) this.target = targets[Math.floor(Math.random() * targets.length)];
      const dx = this.target.x - this.x;
      const dy = this.target.y - this.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 1.8) {
        this.x += dx * 0.005 * this.speed;
        this.y += dy * 0.005 * this.speed;
      } else {
        this.x += (Math.random() - 0.5) * 0.7;
        this.y += (Math.random() - 0.5) * 0.7;
      }
    } else {
      this.x += Math.cos(this.angle) * this.speed * (0.8 - p * 0.5);
      this.y += Math.sin(this.angle) * this.speed * (0.8 - p * 0.5);
      this.angle += (Math.random() - 0.5) * 0.035;
      if (this.x < 0) this.x += canvas.width;
      if (this.x > canvas.width) this.x -= canvas.width;
      if (this.y < 0) this.y += canvas.height;
      if (this.y > canvas.height) this.y -= canvas.height;
    }

    this.hue = 50 * (1 - p) + (210 + Math.random() * 30) * p;
    this.alpha = 0.3 * (1 - p) + (0.4 + Math.sin(now * 0.0007 + this.phase) * 0.35) * p;
    this.speed = (Math.random() * 0.45 + 0.12) * (1 - p * 0.65);
  }

  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    const p = this.transitionProgress;
    if (p > 0.1) {
      ctx.fillStyle = `hsl(${this.hue}, 80%, ${82 + Math.sin(Date.now() * 0.0018 + this.phase) * 14}%)`;
      ctx.shadowBlur = 15 + p * 15;
      ctx.shadowColor = '#e0f8ff';
    } else {
      ctx.fillStyle = `hsl(${this.hue}, 100%, ${75 + Math.sin(Date.now() * 0.001 + this.phase) * 10}%)`;
      ctx.shadowBlur = this.isBackground ? 10 : 20;
      ctx.shadowColor = '#c4b5fd';
    }
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

const fireflies = [];
for (let i = 0; i < 220; i++) fireflies.push(new Firefly(false));
for (let i = 0; i < 100; i++) fireflies.push(new Firefly(true));

function getNingPoints() {
  const temp = document.createElement('canvas');
  temp.width = 1100;
  temp.height = 1100;
  const tctx = temp.getContext('2d');
  tctx.font = 'bold 920px sans-serif';
  tctx.textAlign = 'center';
  tctx.textBaseline = 'middle';
  tctx.fillStyle = '#fff';
  tctx.fillText('宁', 550, 550);
  const points = [];
  const data = tctx.getImageData(0, 0, 1100, 1100).data;
  for (let y = 0; y < 1100; y += 3) {
    for (let x = 0; x < 1100; x += 3) {
      if (data[(y * 1100 + x) * 4 + 3] > 60) {
        points.push({
          x: (x / 1100) * canvas.width * 0.72 + canvas.width * 0.14,
          y: (y / 1100) * canvas.height * 0.78 + canvas.height * 0.08
        });
      }
    }
  }
  return points;
}

let ningPoints = [];

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (ningPoints.length === 0) ningPoints = getNingPoints();
  fireflies.forEach(f => {
    f.update(ningPoints);
    f.draw();
  });
  requestAnimationFrame(animate);
}
animate();

// ===================== 对话流程 =====================
const mainContent = document.getElementById('mainContent');
const stage = document.getElementById('stage');
const btnContainer = document.getElementById('buttons');
const bgm = document.getElementById('bgm');
const bgm2 = document.getElementById('bgm2');

const dialog = [
   { text: "展信佳\n这是一份\n来自遥远星星的回函", buttons: ["见字如晤"], auto: 0 },
  { text: "没想到我会更新吧\n农历生日快乐啦", buttons: [], auto: 4000 },
  { text: "所以之前的内容是新历生日限定啦\n至于新的内容什么时候被看到嘛\n就不知道了", buttons: [], auto: 5000 },
  { text: "至于这次为什么要更新呢？", buttons: [], auto: 3000 },
  { text: "之前你的愿望有萤火虫保密\n而且也没能看到你拆盒子\n还是有些遗憾的", buttons: [], auto: 6000 },
  { text: "这次呢\n我做了你也可以发送信息的设计\n增强一下互动感", buttons: [], auto: 5000 },
  { text: "如果你想分享一下你的愿望", buttons: [], auto: 3000 },
  { text: "And最近有什么好玩的事\n或者有什么烦恼\n都可以说说看咯", buttons: [], auto: 6000 },

  { 
    text: "期待你的来信", 
    buttons: ["写信"], 
    auto: 0 
  },
  { 
    text: "想写就写，不写也可以直接继续～", 
    buttons: [], 
    isWishing: true 
  },
  ];

let current = 0;

setTimeout(() => {
  mainContent.classList.add('visible');
  showStep();
}, 1600);

function downloadWishAsTxt(wishText) {
  if (!wishText.trim()) return;

  const now = new Date();
  const dateStr = now.toISOString().slice(0,10);
  const timeStr = now.toTimeString().slice(0,8).replace(/:/g, '-');

  const filename = `宁小倩生日小愿望_${dateStr}_${timeStr}.txt`;

  const content = [
    `宁小倩 ${dateStr} 的生日小愿望`,
    '',
    wishText,
    '',
    `—— 保存于 ${now.toLocaleString('zh-CN')}`,
    '（这份文件由生日贺卡自动生成）'
  ].join('\n');

  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function showToast(message, isSuccess = true) {
  const toast = document.createElement('div');
  toast.style.position = 'fixed';
  toast.style.bottom = '40px';
  toast.style.left = '50%';
  toast.style.transform = 'translateX(-50%)';
  toast.style.background = isSuccess ? 'rgba(74,222,128,0.95)' : 'rgba(239,68,68,0.95)';
  toast.style.color = 'white';
  toast.style.padding = '14px 28px';
  toast.style.borderRadius = '999px';
  toast.style.boxShadow = '0 10px 30px rgba(0,0,0,0.4)';
  toast.style.zIndex = '9999';
  toast.style.fontSize = '1.15rem';
  toast.style.whiteSpace = 'nowrap';
  toast.textContent = message;
  document.body.appendChild(toast);

  setTimeout(() => {
    toast.style.transition = 'all 0.5s';
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(20px)';
    setTimeout(() => toast.remove(), 500);
  }, 2800);
}

function showStep() {
  if (current >= dialog.length) {
    enterFinishStage();
    return;
  }

  const item = dialog[current];
  stage.classList.remove('visible');

  setTimeout(() => {
    stage.textContent = item.text;
    stage.classList.add('visible');

    btnContainer.innerHTML = '';

    if (item.isWishing) {
      const wrapper = document.createElement('div');
      wrapper.style.margin = '2rem 0';
      wrapper.style.width = 'min(86%, 640px)';
      wrapper.style.display = 'flex';
      wrapper.style.flexDirection = 'column';
      wrapper.style.gap = '1.2rem';
      wrapper.style.alignItems = 'center';

      const textarea = document.createElement('textarea');
      textarea.value = '';
      textarea.placeholder = "今年想对自己 / 对我说些什么呢...";
      textarea.maxLength = 280;
      textarea.style.width = '100%';
      textarea.style.minHeight = '140px';
      textarea.style.padding = '1rem';
      textarea.style.fontSize = '1.15rem';
      textarea.style.borderRadius = '12px';
      textarea.style.border = '2px solid #a078d0';
      textarea.style.background = 'rgba(20,20,40,0.6)';
      textarea.style.color = 'white';
      textarea.style.resize = 'vertical';

      const sendBtn = document.createElement('button');
      sendBtn.className = 'btn';
      sendBtn.textContent = '写好了，继续';
      sendBtn.style.padding = '0.9rem 2.8rem';

      sendBtn.onclick = () => {
        const wishText = textarea.value.trim();
        if (wishText) {
          fetch('https://eot2mpox4zshyec.m.pipedream.net', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              wish: wishText,
              date: new Date().toLocaleString('zh-CN'),
              ua: navigator.userAgent
            })
          }).catch(err => {
            console.log('留言发送失败', err);
          });
        }

        current++;
        showStep();
      };

      wrapper.appendChild(textarea);
      wrapper.appendChild(sendBtn);

      btnContainer.appendChild(wrapper);
    }
    else if (item.buttons && item.buttons.length) {
      item.buttons.forEach(txt => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.textContent = txt;
        btn.onclick = () => {
          if (txt === "见字如晤" || txt === "来首音乐") {
            bgm.play().catch(() => console.log("自动播放被阻止"));
          }
          current++;
          showStep();
        };
        btnContainer.appendChild(btn);
      });
    }

    if (item.auto > 0) {
      setTimeout(() => {
        current++;
        showStep();
      }, item.auto);
    }

  }, 1600);
}

function enterFinishStage() {
  stage.style.display = 'none';
  btnContainer.style.display = 'none';

  fireflies.forEach(f => f.startStarTransition());

  setTimeout(() => {
    const finish = document.getElementById('finish');

    let wishHtml = '';

    let html = `
      <h1 style="font-size: clamp(3rem, 9vw, 5.5rem); opacity:0; animation: fadeIn 2s forwards 0.5s;">
        🎂 生日快乐🎂
      </h1>
      <h1 style="font-size: clamp(3rem, 9vw, 5.5rem); opacity:0; animation: fadeIn 2s forwards 0.5s;">
        ✨宁小倩✨
      </h1>
      ${wishHtml}
      <div style="margin:1.8em 0 2.5em; font-size:1.7rem; opacity:0; animation: fadeIn 2s forwards 1.2s;">
        I wish I was a cat  just miaomiaomiao
      </div>
    `;

    html += `
      <button class="btn" id="btn-review" style="margin-top:3.5rem; font-size:1.4rem; padding:1.1rem 3.2rem;">
        忆往昔
      </button>
    `;

    finish.innerHTML = html;
    finish.style.display = 'block';

    document.getElementById('btn-review').onclick = () => {
      if (!bgm.paused) bgm.pause();
      bgm2.play().catch(e => console.log("第二首播放被阻止", e));

      finish.style.display = 'none';
      document.getElementById('photo-gallery').style.display = 'flex';
      currentPhotoIndex = 0;
      showPhoto(0);
      startSlideshow();
    };

    document.getElementById('prev-photo').onclick = () => {
      currentPhotoIndex = (currentPhotoIndex - 1 + photos.length) % photos.length;
      showPhoto(currentPhotoIndex);
    };

    document.getElementById('next-photo').onclick = () => {
      currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
      showPhoto(currentPhotoIndex);
    };

    document.getElementById('toggle-play').onclick = function() {
      if (slideshowInterval) {
        stopSlideshow();
        this.textContent = '继续播放';
      } else {
        startSlideshow();
        this.textContent = '暂停';
      }
    };

    document.getElementById('back-to-finish').onclick = () => {
      document.getElementById('photo-gallery').style.display = 'none';
      finish.style.display = 'block';
      stopSlideshow();
      document.getElementById('toggle-play').textContent = '暂停';

      if (!bgm2.paused) bgm2.pause();
    };

  }, 1800);
};

// 照片回顾功能
const photos = [
  "1.jpg", "2.jpg", "3.jpg", "4.jpg", "5.jpg",
  "6.jpg", "7.jpg", "8.jpg", "9.jpg", "10.jpg",
  "11.jpg", "12.jpg"
];

let currentPhotoIndex = 0;
let slideshowInterval = null;
const photoContainer = document.getElementById('photo-container');

function showPhoto(index) {
  photoContainer.innerHTML = `
    <img src="${photos[index]}" alt="回忆 ${index+1}" class="active">
  `;
}

function startSlideshow() {
  if (slideshowInterval) clearInterval(slideshowInterval);
  slideshowInterval = setInterval(() => {
    currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
    showPhoto(currentPhotoIndex);
  }, 24000);
}

function stopSlideshow() {
  if (slideshowInterval) {
    clearInterval(slideshowInterval);
    slideshowInterval = null;
  }
}
</script>
</body>
</html>
