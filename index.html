<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>日记</title>
  <style>
    :root {
      --bg: #0a0f1a;
      --grass: #0b1e0b;
      --text: #f0f8ff;
      --paper: #f7f0e0;
      --paper-dark: #ebe2d0;
      --ink: #2c2416;
      --accent: #d4a5ff;
      --spine: #8b6914;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      background: linear-gradient(to bottom, var(--grass) 30%, var(--bg) 70%);
      color: var(--text);
      font-family: "Songti SC", "SimSun", "STSong", "Noto Serif SC", serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      user-select: none;
    }

    canvas#fireflies {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .book-wrapper {
      position: relative;
      z-index: 10;
      width: min(92vw, 860px);
      height: min(78vh, 620px);
      perspective: 2500px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .book {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
    }

    .page {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
      cursor: pointer;
    }

    .page .front,
    .page .back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 0 6px 6px 0;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }

    .page .front {
      background: linear-gradient(90deg, #f0e6d0 0%, var(--paper) 8%, var(--paper) 100%);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      padding: 1.8rem 1.6rem 1.4rem 2rem;
    }

    .page .back {
      background: linear-gradient(270deg, #f0e6d0 0%, var(--paper-dark) 8%, var(--paper-dark) 100%);
      color: var(--ink);
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      padding: 1.8rem 2rem 1.4rem 1.6rem;
    }

    /* 封面特殊样式 */
    .page.cover .front,
    .page.cover .back {
      background: linear-gradient(135deg, #3a2a1a 0%, #5c4030 40%, #3a2a1a 100%);
      color: #f5e6c8;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 2px solid #8b6914;
    }

    .cover-title {
      font-size: clamp(1.8rem, 4.5vw, 2.8rem);
      letter-spacing: 0.35em;
      margin-bottom: 1.2rem;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      height: 55%;
      display: flex;
      align-items: center;
    }

    .cover-sub {
      font-size: 1rem;
      opacity: 0.85;
      letter-spacing: 0.15em;
      margin-top: 1rem;
    }

    .page-content {
      flex: 1;
      overflow-y: auto;
      font-size: clamp(0.95rem, 2.1vw, 1.15rem);
      line-height: 1.95;
      text-align: justify;
      letter-spacing: 0.04em;
      white-space: pre-wrap;
    }

    .page-content p {
      margin-bottom: 0.9em;
      text-indent: 2em;
    }

    .page-footer {
      margin-top: 0.8rem;
      font-size: 0.85rem;
      opacity: 0.65;
      text-align: center;
      letter-spacing: 0.1em;
    }

    .book::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 18px;
      height: 100%;
      transform: translateX(-50%);
      background: linear-gradient(90deg,
        rgba(0,0,0,0.25) 0%,
        rgba(0,0,0,0.08) 40%,
        rgba(0,0,0,0.15) 100%);
      z-index: 100;
      pointer-events: none;
      border-radius: 2px;
    }

    .controls {
      position: relative;
      z-index: 20;
      margin-top: 1.6rem;
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .ctrl-btn {
      padding: 0.7rem 1.8rem;
      font-size: 1.05rem;
      color: white;
      background: linear-gradient(135deg, #a078d0, #7a5aa8);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(160,120,208,0.35);
      transition: all 0.3s;
      font-family: system-ui, sans-serif;
    }

    .ctrl-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 26px rgba(160,120,208,0.55);
    }

    .ctrl-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .page-indicator {
      font-size: 1rem;
      color: #c9b8e8;
      min-width: 90px;
      text-align: center;
      font-family: system-ui, sans-serif;
    }

    .hint {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      font-size: 0.85rem;
      color: rgba(240,248,255,0.55);
      font-family: system-ui, sans-serif;
      letter-spacing: 0.08em;
    }

    .loading {
      position: relative;
      z-index: 20;
      color: #c9b8e8;
      font-size: 1.2rem;
      font-family: system-ui, sans-serif;
    }

    @media (max-width: 640px) {
      .book-wrapper {
        height: min(72vh, 520px);
      }
      .page .front,
      .page .back {
        padding: 1.2rem 1rem;
      }
      .page-content {
        font-size: 0.92rem;
        line-height: 1.85;
      }
      .controls {
        gap: 0.8rem;
      }
      .ctrl-btn {
        padding: 0.6rem 1.3rem;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="fireflies"></canvas>

  <div class="book-wrapper">
    <div class="book" id="book">
      <div class="loading" id="loading">正在加载日记...</div>
    </div>
  </div>

  <div class="controls" id="controls" style="display:none;">
    <button class="ctrl-btn" id="prevBtn">上一页</button>
    <div class="page-indicator" id="pageIndicator">1 / 1</div>
    <button class="ctrl-btn" id="nextBtn">下一页</button>
  </div>

  <div class="hint">点击页面右侧或按钮翻页 · 可左右滑动</div>

  <script>
    // ===================== 萤火虫 =====================
    const canvas = document.getElementById('fireflies');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    class Firefly {
      constructor(isBackground = false) {
        this.isBackground = isBackground;
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height * (this.isBackground ? 0.12 : 0.55) + Math.random() * canvas.height * (this.isBackground ? 0.75 : 0.4);
        this.size = Math.random() * 2.6 + 1.1;
        this.speed = Math.random() * 0.45 + 0.12;
        this.angle = Math.random() * Math.PI * 2;
        this.hue = 48 + Math.random() * 28;
        this.alpha = Math.random() * 0.38 + 0.14;
        this.phase = Math.random() * Math.PI * 2;
      }
      update() {
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.angle += (Math.random() - 0.5) * 0.03;
        if (this.x < 0) this.x += canvas.width;
        if (this.x > canvas.width) this.x -= canvas.width;
        if (this.y < 0) this.y += canvas.height;
        if (this.y > canvas.height) this.y -= canvas.height;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = `hsl(${this.hue}, 100%, ${72 + Math.sin(Date.now() * 0.001 + this.phase) * 12}%)`;
        ctx.shadowBlur = this.isBackground ? 9 : 18;
        ctx.shadowColor = '#c4b5fd';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    const fireflies = [];
    for (let i = 0; i < 180; i++) fireflies.push(new Firefly(false));
    for (let i = 0; i < 80; i++) fireflies.push(new Firefly(true));

    function animateFireflies() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fireflies.forEach(f => { f.update(); f.draw(); });
      requestAnimationFrame(animateFireflies);
    }
    animateFireflies();

    // ===================== 从文本文件加载日记 =====================
    /**
     * 解析 diary.txt
     * 格式规则：
     *   【封面】 / 【封面背面】 / 【第1页】 / 【第2页】 ... / 【封底】 / 【封底背面】
     * 每一段标题后的内容直到下一个【】之前，就是该页的内容。
     */
    function parseDiaryText(text) {
      const sections = [];
      // 匹配所有 【标题】 和其后的内容
      const regex = /【([^】]+)】\s*([\s\S]*?)(?=【|$)/g;
      let match;

      while ((match = regex.exec(text)) !== null) {
        const title = match[1].trim();
        const content = match[2].trim();
        sections.push({ title, content });
      }

      // 把连续的两页合成一叶（front + back）
      const pagesData = [];
      for (let i = 0; i < sections.length; i += 2) {
        const frontSec = sections[i];
        const backSec = sections[i + 1] || { title: '', content: '' };

        const isCover = frontSec.title.includes('封面') || frontSec.title.includes('封底');

        let frontHtml = '';
        let backHtml = '';

        if (isCover) {
          // 封面样式
          const lines = frontSec.content.split('\n').map(l => l.trim()).filter(Boolean);
          frontHtml = `
            <div class="cover-title">${lines[0] || frontSec.title}</div>
            ${lines.slice(1).map(l => `<div class="cover-sub">${l}</div>`).join('')}
          `;
          const backLines = backSec.content.split('\n').map(l => l.trim()).filter(Boolean);
          backHtml = backLines.map(l => `<div style="margin:0.6em 0;font-size:1.05rem;">${l}</div>`).join('');
        } else {
          // 普通页面：把换行变成段落
          frontHtml = `
            <div class="page-content">${formatContent(frontSec.content)}</div>
            <div class="page-footer">${frontSec.title.replace(/第|页/g, '') || ''}</div>
          `;
          backHtml = `
            <div class="page-content">${formatContent(backSec.content)}</div>
            <div class="page-footer">${backSec.title.replace(/第|页/g, '') || ''}</div>
          `;
        }

        pagesData.push({
          isCover,
          front: frontHtml,
          back: backHtml
        });
      }

      return pagesData;
    }

    function formatContent(text) {
      // 按空行分段，每段变成 <p>
      return text
        .split(/\n\s*\n/)
        .map(para => para.trim())
        .filter(Boolean)
        .map(para => {
          // 如果是诗歌（每行较短且居中风格），不缩进
          const lines = para.split('\n').map(l => l.trim()).filter(Boolean);
          if (lines.length > 1 && lines.every(l => l.length < 20)) {
            return lines.map(l => `<p style="text-indent:0;text-align:center;margin:0.4em 0;">${l}</p>`).join('');
          }
          return `<p>${para.replace(/\n/g, '<br>')}</p>`;
        })
        .join('');
    }

    // ===================== 翻书逻辑 =====================
    let pagesData = [];
    let currentPage = 0;
    let totalLeaves = 0;
    const book = document.getElementById('book');

    function createPages() {
      book.innerHTML = '';
      pagesData.forEach((data, index) => {
        const page = document.createElement('div');
        page.className = 'page' + (data.isCover ? ' cover' : '');
        page.dataset.index = index;
        page.style.zIndex = totalLeaves - index;

        page.innerHTML = `
          <div class="front">${data.front}</div>
          <div class="back">${data.back}</div>
        `;

        page.addEventListener('click', (e) => {
          const rect = page.getBoundingClientRect();
          const x = e.clientX - rect.left;
          if (x > rect.width * 0.45) nextPage();
          else prevPage();
        });

        book.appendChild(page);
      });
      updateUI();
      document.getElementById('controls').style.display = 'flex';
    }

    function flipTo(index) {
      if (index < 0 || index > totalLeaves) return;
      currentPage = index;
      const pages = book.querySelectorAll('.page');
      pages.forEach((page, i) => {
        if (i < currentPage) {
          page.style.transform = 'rotateY(-180deg)';
          page.style.zIndex = i + 1;
        } else {
          page.style.transform = 'rotateY(0deg)';
          page.style.zIndex = totalLeaves - i;
        }
      });
      updateUI();
    }

    function nextPage() {
      if (currentPage < totalLeaves) flipTo(currentPage + 1);
    }

    function prevPage() {
      if (currentPage > 0) flipTo(currentPage - 1);
    }

    function updateUI() {
      const indicator = document.getElementById('pageIndicator');
      indicator.textContent = `${Math.min(currentPage + 1, totalLeaves)} / ${totalLeaves}`;
      document.getElementById('prevBtn').disabled = currentPage <= 0;
      document.getElementById('nextBtn').disabled = currentPage >= totalLeaves;
    }

    document.getElementById('prevBtn').addEventListener('click', prevPage);
    document.getElementById('nextBtn').addEventListener('click', nextPage);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextPage();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevPage();
      }
    });

    let touchStartX = 0;
    book.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    book.addEventListener('touchend', (e) => {
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) nextPage();
        else prevPage();
      }
    }, { passive: true });

    // ===================== 加载文本文件 =====================
    async function loadDiary() {
      try {
        const response = await fetch('diary.txt');
        if (!response.ok) throw new Error('无法读取 diary.txt');
        const text = await response.text();
        pagesData = parseDiaryText(text);
        totalLeaves = pagesData.length;

        if (totalLeaves === 0) {
          document.getElementById('loading').textContent = '日记内容为空，请检查 diary.txt';
          return;
        }

        createPages();
      } catch (err) {
        console.error(err);
        document.getElementById('loading').innerHTML = `
          <div style="text-align:center;padding:2rem;color:#f5e6c8;">
            <p style="margin-bottom:1rem;">无法加载 diary.txt</p>
            <p style="font-size:0.9rem;opacity:0.8;line-height:1.6;">
              请确保 diary.txt 和 index.html 在同一文件夹，<br>
              并使用本地服务器打开（推荐 Live Server 或 python -m http.server）
            </p>
          </div>
        `;
      }
    }

    loadDiary();
  </script>
</body>
</html>
