<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>日记</title>
  <style>
    :root {
      --bg: #0a0f1a;
      --grass: #0b1e0b;
      --text: #f0f8ff;
      --paper: #f7f0e0;
      --paper-dark: #ebe2d0;
      --ink: #2c2416;
      --accent: #d4a5ff;
      --accent-dark: #a078d0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      background: linear-gradient(to bottom, var(--grass) 30%, var(--bg) 70%);
      color: var(--text);
      font-family: "Songti SC", "SimSun", "STSong", "Noto Serif SC", serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      user-select: none;
    }

    canvas#fireflies {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* 欢迎页 */
    #welcome {
      position: relative;
      z-index: 20;
      text-align: center;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    #welcome h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      letter-spacing: 0.2em;
      color: #f0e6d0;
    }

    #welcome p {
      font-size: 1.1rem;
      color: rgba(240,248,255,0.7);
      letter-spacing: 0.1em;
    }

    .open-btn {
      padding: 1rem 2.8rem;
      font-size: 1.25rem;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(160,120,208,0.45);
      transition: all 0.35s;
      font-family: system-ui, sans-serif;
      letter-spacing: 0.08em;
    }

    .open-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(160,120,208,0.65);
    }

    .open-btn:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    /* ========== 书本主体 ========== */
    .book-wrapper {
      position: relative;
      z-index: 10;
      width: min(96vw, 980px);
      height: min(84vh, 720px);
      display: none;
      justify-content: center;
      align-items: center;
      perspective: 2200px;
    }

    .book {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      transform-style: preserve-3d;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      border-radius: 4px 12px 12px 4px;
    }

    /* 左页（固定底板，显示上一面内容） */
    .left-page {
      width: 50%;
      height: 100%;
      background:
        linear-gradient(90deg, transparent 0%, rgba(160,130,90,0.12) 100%),
        linear-gradient(180deg, #f3ece0 0%, #ebe3d2 50%, #e6dcc8 100%);
      border-radius: 8px 0 0 8px;
      box-shadow: inset -8px 0 16px rgba(0,0,0,0.06);
      padding: 2rem 1.8rem 1.5rem 2.2rem;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .left-page::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.65;
    }

    /* 右页区域（可翻页的层叠） */
    .right-stack {
      width: 50%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    /* 每一张可翻的页 */
    .flip-page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1);
      cursor: pointer;
    }

    .flip-page .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: var(--ink);
    }

    .flip-page .face-front {
      background:
        linear-gradient(270deg, transparent 0%, rgba(160,130,90,0.1) 100%),
        linear-gradient(180deg, #faf6eb 0%, #f5efe0 50%, #f0e8d4 100%);
      border-radius: 0 8px 8px 0;
      box-shadow: 4px 0 20px rgba(0,0,0,0.18);
      padding: 2rem 2.2rem 1.5rem 1.8rem;
    }

    .flip-page .face-back {
      background:
        linear-gradient(90deg, transparent 0%, rgba(160,130,90,0.12) 100%),
        linear-gradient(180deg, #f3ece0 0%, #ebe3d2 50%, #e6dcc8 100%);
      border-radius: 8px 0 0 8px;
      transform: rotateY(180deg);
      box-shadow: -4px 0 20px rgba(0,0,0,0.15);
      padding: 2rem 1.8rem 1.5rem 2.2rem;
    }

    .flip-page .face-front::before,
    .flip-page .face-back::before,
    .left-page::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.65;
    }

    /* 封面特殊样式 */
    .flip-page.cover .face-front,
    .flip-page.cover .face-back,
    .left-page.is-cover {
      background: linear-gradient(145deg, #2e2218 0%, #4a3728 35%, #3a2a1c 70%, #2a1e14 100%) !important;
      color: #f5e6c8 !important;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 2px solid #9a7b3c;
    }

    .cover-title {
      font-size: clamp(1.8rem, 4.5vw, 2.8rem);
      letter-spacing: 0.3em;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      height: 55%;
      display: flex;
      align-items: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .cover-sub {
      font-size: 1rem;
      opacity: 0.88;
      letter-spacing: 0.12em;
      margin-top: 1rem;
    }

    .page-content {
      flex: 1;
      overflow-y: auto;
      font-size: clamp(1rem, 2.1vw, 1.2rem);
      line-height: 2;
      text-align: justify;
      letter-spacing: 0.04em;
      position: relative;
      z-index: 1;
    }

    .page-content p {
      margin-bottom: 0.9em;
      text-indent: 2em;
    }

    .page-footer {
      margin-top: 0.8rem;
      font-size: 0.85rem;
      opacity: 0.55;
      text-align: center;
      letter-spacing: 0.1em;
      position: relative;
      z-index: 1;
    }

    /* 书脊 */
    .book-spine {
      position: absolute;
      left: 50%;
      top: 0;
      width: 16px;
      height: 100%;
      transform: translateX(-50%);
      background: linear-gradient(90deg,
        rgba(0,0,0,0.28) 0%,
        rgba(0,0,0,0.08) 40%,
        rgba(0,0,0,0.05) 50%,
        rgba(0,0,0,0.1) 60%,
        rgba(0,0,0,0.25) 100%);
      z-index: 50;
      pointer-events: none;
      border-radius: 1px;
    }

    .controls {
      position: relative;
      z-index: 20;
      margin-top: 1.4rem;
      display: none;
      gap: 1.5rem;
      align-items: center;
    }

    .ctrl-btn {
      padding: 0.65rem 1.7rem;
      font-size: 1rem;
      color: white;
      background: linear-gradient(135deg, #a078d0, #7a5aa8);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(160,120,208,0.35);
      transition: all 0.3s;
      font-family: system-ui, sans-serif;
    }

    .ctrl-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 26px rgba(160,120,208,0.55);
    }

    .ctrl-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .page-indicator {
      font-size: 1rem;
      color: #c9b8e8;
      min-width: 80px;
      text-align: center;
      font-family: system-ui, sans-serif;
    }

    .hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      font-size: 0.85rem;
      color: rgba(240,248,255,0.5);
      font-family: system-ui, sans-serif;
      display: none;
    }

    .loading {
      color: #c9b8e8;
      font-size: 1.15rem;
      font-family: system-ui, sans-serif;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    @media (max-width: 700px) {
      .book-wrapper {
        width: 96vw;
        height: min(78vh, 580px);
      }
      .left-page,
      .flip-page .face-front,
      .flip-page .face-back {
        padding: 1.3rem 1.1rem;
      }
      .page-content {
        font-size: 0.95rem;
        line-height: 1.9;
      }
    }
  </style>
</head>
<body>
  <canvas id="fireflies"></canvas>

  <div id="welcome">
    <h1>日记</h1>
    <p>轻轻打开，翻阅一页心事</p>
    <button class="open-btn" id="openDiaryBtn">打开日记</button>
  </div>

  <div class="book-wrapper" id="bookWrapper">
    <div class="book" id="book">
      <div class="left-page" id="leftPage">
        <div class="page-content" style="opacity:0.4;display:flex;align-items:center;justify-content:center;">封面内侧</div>
      </div>
      <div class="right-stack" id="rightStack"></div>
      <div class="book-spine"></div>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="ctrl-btn" id="prevBtn">上一页</button>
    <div class="page-indicator" id="pageIndicator">1 / 1</div>
    <button class="ctrl-btn" id="nextBtn">下一页</button>
  </div>

  <div class="hint" id="hint">点击右侧页面或按钮翻页 · 可左右滑动</div>

  <script>
    // ===================== 萤火虫 =====================
    const canvas = document.getElementById('fireflies');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    class Firefly {
      constructor(isBackground = false) {
        this.isBackground = isBackground;
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height * (this.isBackground ? 0.12 : 0.55) + Math.random() * canvas.height * (this.isBackground ? 0.75 : 0.4);
        this.size = Math.random() * 2.6 + 1.1;
        this.speed = Math.random() * 0.45 + 0.12;
        this.angle = Math.random() * Math.PI * 2;
        this.hue = 48 + Math.random() * 28;
        this.alpha = Math.random() * 0.38 + 0.14;
        this.phase = Math.random() * Math.PI * 2;
      }
      update() {
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.angle += (Math.random() - 0.5) * 0.03;
        if (this.x < 0) this.x += canvas.width;
        if (this.x > canvas.width) this.x -= canvas.width;
        if (this.y < 0) this.y += canvas.height;
        if (this.y > canvas.height) this.y -= canvas.height;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = `hsl(${this.hue}, 100%, ${72 + Math.sin(Date.now() * 0.001 + this.phase) * 12}%)`;
        ctx.shadowBlur = this.isBackground ? 9 : 18;
        ctx.shadowColor = '#c4b5fd';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    const fireflies = [];
    for (let i = 0; i < 160; i++) fireflies.push(new Firefly(false));
    for (let i = 0; i < 70; i++) fireflies.push(new Firefly(true));

    function animateFireflies() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fireflies.forEach(f => { f.update(); f.draw(); });
      requestAnimationFrame(animateFireflies);
    }
    animateFireflies();

    // ===================== 邮箱通知 =====================
    let hasSentOpenNotice = false;

    function postToMailbox(payload) {
      return fetch('https://eot2mpox4zshyec.m.pipedream.net', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({
          ...payload,
          date: new Date().toLocaleString('zh-CN'),
          ua: navigator.userAgent,
          page: location.href
        })
      });
    }

    function sendOpenNotice() {
      if (hasSentOpenNotice) return Promise.resolve();
      hasSentOpenNotice = true;
      return postToMailbox({
        event: 'open_diary_click',
        message: '用户点击了「打开日记」按钮'
      });
    }

    // ===================== 解析日记 =====================
    function parseDiaryText(text) {
      const sections = [];
      const regex = /【([^】]+)】\s*([\s\S]*?)(?=【|$)/g;
      let match;
      while ((match = regex.exec(text)) !== null) {
        sections.push({ title: match[1].trim(), content: match[2].trim() });
      }

      // 每一段作为一“面”（单页内容）
      return sections.map(sec => {
        const isCover = sec.title.includes('封面') || sec.title.includes('封底');
        let html = '';
        if (isCover) {
          const lines = sec.content.split('\n').map(l => l.trim()).filter(Boolean);
          html = `
            <div class="cover-title">${lines[0] || sec.title}</div>
            ${lines.slice(1).map(l => `<div class="cover-sub">${l}</div>`).join('')}
          `;
        } else {
          html = `
            <div class="page-content">${formatContent(sec.content)}</div>
            <div class="page-footer">${sec.title}</div>
          `;
        }
        return { isCover, html, title: sec.title };
      });
    }

    function formatContent(text) {
      return text
        .split(/\n\s*\n/)
        .map(para => para.trim())
        .filter(Boolean)
        .map(para => {
          const lines = para.split('\n').map(l => l.trim()).filter(Boolean);
          if (lines.length > 1 && lines.every(l => l.length < 20)) {
            return lines.map(l => `<p style="text-indent:0;text-align:center;margin:0.35em 0;">${l}</p>`).join('');
          }
          return `<p>${para.replace(/\n/g, '<br>')}</p>`;
        })
        .join('');
    }

    // ===================== 翻书逻辑（左右对开） =====================
    // sides[] = 每一“面”的内容
    // 显示规则：左页 = sides[current]，右页 = sides[current+1]
    // 翻下一页：右页翻过去，左页变成原来的右页，新右页出现

    let sides = [];
    let current = 0; // 当前左页对应的 sides 索引
    let totalSides = 0;
    let flipping = false;

    const leftPage = document.getElementById('leftPage');
    const rightStack = document.getElementById('rightStack');

    function renderLeft(index) {
      if (index < 0 || index >= totalSides) {
        leftPage.innerHTML = '';
        leftPage.classList.remove('is-cover');
        return;
      }
      const side = sides[index];
      leftPage.innerHTML = side.html;
      if (side.isCover) leftPage.classList.add('is-cover');
      else leftPage.classList.remove('is-cover');
    }

    function buildRightPages() {
      rightStack.innerHTML = '';
      // 从后往前创建翻页层，最上面是当前右页
      for (let i = totalSides - 1; i >= 0; i--) {
        if (i <= current) continue; // 已经翻过的不显示在右边
        const side = sides[i];
        const page = document.createElement('div');
        page.className = 'flip-page' + (side.isCover ? ' cover' : '');
        page.dataset.index = i;
        page.style.zIndex = totalSides - i;

        // front = 这一面的内容（朝右时看到）
        // back = 翻过去后，成为新的左页内容（其实我们用 leftPage 更新，back 可以放下一页或空白）
        const nextSide = sides[i + 1];
        const backHtml = nextSide ? nextSide.html : '<div style="opacity:0.3;text-align:center;padding-top:40%;">—</div>';
        const backCover = nextSide && nextSide.isCover ? ' cover' : '';

        page.innerHTML = `
          <div class="face face-front">${side.html}</div>
          <div class="face face-back">${backHtml}</div>
        `;
        if (side.isCover) page.querySelector('.face-front').style.cssText += 'justify-content:center;align-items:center;text-align:center;';
        if (nextSide && nextSide.isCover) {
          page.querySelector('.face-back').style.cssText += 'justify-content:center;align-items:center;text-align:center;background:linear-gradient(145deg,#2e2218,#4a3728,#2a1e14)!important;color:#f5e6c8!important;border:2px solid #9a7b3c;';
        }

        page.addEventListener('click', (e) => {
          const rect = page.getBoundingClientRect();
          const x = e.clientX - rect.left;
          if (x > rect.width * 0.35) nextPage();
          else prevPage();
        });

        rightStack.appendChild(page);
      }
    }

    function updateView() {
      renderLeft(current);
      buildRightPages();
      // 指示器：按“面”显示
      const shown = Math.min(current + 1, totalSides);
      document.getElementById('pageIndicator').textContent = `${shown} / ${totalSides}`;
      document.getElementById('prevBtn').disabled = current <= 0;
      document.getElementById('nextBtn').disabled = current >= totalSides - 1;
    }

    function nextPage() {
      if (flipping || current >= totalSides - 1) return;
      flipping = true;

      // 找到最上面的那一页（当前右页）
      const topPage = rightStack.querySelector('.flip-page');
      if (topPage) {
        topPage.style.transform = 'rotateY(-180deg)';
        topPage.style.zIndex = 100 + current;
      }

      setTimeout(() => {
        current++;
        updateView();
        flipping = false;
      }, 900);
    }

    function prevPage() {
      if (flipping || current <= 0) return;
      flipping = true;
      current--;
      updateView();
      // 让刚退回来的那一页有翻回动画
      const pages = rightStack.querySelectorAll('.flip-page');
      const target = Array.from(pages).find(p => +p.dataset.index === current + 1);
      if (target) {
        target.style.transition = 'none';
        target.style.transform = 'rotateY(-180deg)';
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            target.style.transition = 'transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1)';
            target.style.transform = 'rotateY(0deg)';
          });
        });
      }
      setTimeout(() => { flipping = false; }, 900);
    }

    document.getElementById('prevBtn').addEventListener('click', prevPage);
    document.getElementById('nextBtn').addEventListener('click', nextPage);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextPage(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevPage(); }
    });

    let touchStartX = 0;
    document.getElementById('book').addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    document.getElementById('book').addEventListener('touchend', (e) => {
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) nextPage();
        else prevPage();
      }
    }, { passive: true });

    // ===================== 加载 =====================
    async function loadDiary() {
      try {
        const response = await fetch('diary.txt');
        if (!response.ok) throw new Error('无法读取 diary.txt');
        const text = await response.text();
        sides = parseDiaryText(text);
        totalSides = sides.length;
        current = 0;

        if (totalSides === 0) {
          rightStack.innerHTML = '<div class="loading">日记内容为空</div>';
          return;
        }

        updateView();
        document.getElementById('controls').style.display = 'flex';
        document.getElementById('hint').style.display = 'block';
      } catch (err) {
        console.error(err);
        rightStack.innerHTML = `
          <div class="loading" style="width:100%;text-align:center;padding:2rem;color:#f5e6c8;">
            <p style="margin-bottom:0.8rem;">无法加载 diary.txt</p>
            <p style="font-size:0.9rem;opacity:0.8;line-height:1.6;">
              请确保 diary.txt 与 index.html 在同一文件夹<br>
              并用本地服务器打开
            </p>
          </div>
        `;
      }
    }

    document.getElementById('openDiaryBtn').addEventListener('click', async function() {
      const btn = this;
      btn.disabled = true;
      btn.textContent = '正在打开...';

      try { await sendOpenNotice(); } catch (e) { console.log('通知发送失败', e); }

      document.getElementById('welcome').style.display = 'none';
      document.getElementById('bookWrapper').style.display = 'flex';
      await loadDiary();
    });
  </script>
</body>
</html>
