<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>日记</title>
  <style>
    :root {
      --bg: #0a0f1a;
      --grass: #0b1e0b;
      --text: #f0f8ff;
      --ink: #2c2416;
      --accent: #d4a5ff;
      --accent-dark: #a078d0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      background: linear-gradient(to bottom, var(--grass) 30%, var(--bg) 70%);
      color: var(--text);
      font-family: "Songti SC", "SimSun", "STSong", "Noto Serif SC", serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      user-select: none;
    }

    canvas#fireflies {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    #welcome {
      position: relative;
      z-index: 20;
      text-align: center;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    #welcome h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      letter-spacing: 0.2em;
      color: #f0e6d0;
    }

    #welcome p {
      font-size: 1.1rem;
      color: rgba(240,248,255,0.7);
      letter-spacing: 0.1em;
    }

    .open-btn {
      padding: 1rem 2.8rem;
      font-size: 1.25rem;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(160,120,208,0.45);
      transition: all 0.35s;
      font-family: system-ui, sans-serif;
      letter-spacing: 0.08em;
    }

    .open-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(160,120,208,0.65);
    }

    .open-btn:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .book-wrapper {
      position: relative;
      z-index: 10;
      width: min(96vw, 1000px);
      height: min(84vh, 720px);
      display: none;
      justify-content: center;
      align-items: center;
      perspective: 2400px;
    }

    .book {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      transform-style: preserve-3d;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
      border-radius: 6px 12px 12px 6px;
    }

    .page-half {
      width: 50%;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: var(--ink);
    }

    .page-half.left {
      background:
        linear-gradient(90deg, transparent 0%, rgba(160,130,90,0.1) 100%),
        linear-gradient(180deg, #f3ece0 0%, #ebe3d2 50%, #e6dcc8 100%);
      border-radius: 8px 0 0 8px;
      box-shadow: inset -6px 0 14px rgba(0,0,0,0.05);
      padding: 2rem 1.7rem 1.4rem 2.1rem;
    }

    .page-half.right {
      background:
        linear-gradient(270deg, transparent 0%, rgba(160,130,90,0.1) 100%),
        linear-gradient(180deg, #faf6eb 0%, #f5efe0 50%, #f0e8d4 100%);
      border-radius: 0 8px 8px 0;
      box-shadow: 4px 0 18px rgba(0,0,0,0.15);
      padding: 2rem 2.1rem 1.4rem 1.7rem;
      cursor: pointer;
    }

    .page-half::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.6;
    }

    .cover-page {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #2e2218 0%, #4a3728 35%, #3a2a1c 70%, #2a1e14 100%);
      color: #f5e6c8;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 3px solid #9a7b3c;
      border-radius: 8px 12px 12px 8px;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.3), 0 12px 40px rgba(0,0,0,0.4);
      cursor: pointer;
      position: relative;
      z-index: 5;
    }

    .cover-title {
      font-size: clamp(2rem, 5vw, 3.2rem);
      letter-spacing: 0.35em;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      height: 50%;
      display: flex;
      align-items: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      margin-bottom: 1.2rem;
    }

    .cover-sub {
      font-size: 1.05rem;
      opacity: 0.88;
      letter-spacing: 0.15em;
      margin-top: 0.6rem;
    }

    .page-content {
      flex: 1;
      overflow-y: auto;
      font-size: clamp(1rem, 2.1vw, 1.22rem);
      line-height: 2;
      text-align: justify;
      letter-spacing: 0.04em;
      position: relative;
      z-index: 1;
    }

    .page-content p {
      margin-bottom: 0.85em;
      text-indent: 2em;
    }

    .page-footer {
      margin-top: 0.7rem;
      font-size: 0.82rem;
      opacity: 0.5;
      text-align: center;
      letter-spacing: 0.1em;
      position: relative;
      z-index: 1;
    }

    .book-spine {
      position: absolute;
      left: 50%;
      top: 0;
      width: 14px;
      height: 100%;
      transform: translateX(-50%);
      background: linear-gradient(90deg,
        rgba(0,0,0,0.25) 0%,
        rgba(0,0,0,0.06) 40%,
        rgba(0,0,0,0.04) 50%,
        rgba(0,0,0,0.08) 60%,
        rgba(0,0,0,0.22) 100%);
      z-index: 20;
      pointer-events: none;
      display: none;
    }

    .controls {
      position: relative;
      z-index: 20;
      margin-top: 1.3rem;
      display: none;
      gap: 1.4rem;
      align-items: center;
    }

    .ctrl-btn {
      padding: 0.6rem 1.6rem;
      font-size: 1rem;
      color: white;
      background: linear-gradient(135deg, #a078d0, #7a5aa8);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(160,120,208,0.35);
      transition: all 0.3s;
      font-family: system-ui, sans-serif;
    }

    .ctrl-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 22px rgba(160,120,208,0.5);
    }

    .ctrl-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .page-indicator {
      font-size: 0.95rem;
      color: #c9b8e8;
      min-width: 90px;
      text-align: center;
      font-family: system-ui, sans-serif;
    }

    .hint {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      font-size: 0.82rem;
      color: rgba(240,248,255,0.5);
      font-family: system-ui, sans-serif;
      display: none;
    }

    .music-tip {
      font-size: 0.85rem;
      color: rgba(240,248,255,0.45);
      margin-top: 0.5rem;
      font-family: system-ui, sans-serif;
    }

    @media (max-width: 700px) {
      .book-wrapper {
        width: 96vw;
        height: min(76vh, 560px);
      }
      .page-half.left,
      .page-half.right {
        padding: 1.2rem 1rem;
      }
      .page-content {
        font-size: 0.92rem;
        line-height: 1.9;
      }
    }
  </style>
</head>
<body>
  <canvas id="fireflies"></canvas>

  <audio id="bgm" loop preload="auto">
    <source src="bgm.mp3" type="audio/mpeg">
  </audio>

  <div id="welcome">
    <h1>日记</h1>
    <p>轻轻打开，翻阅一页心事</p>
    <button class="open-btn" id="openDiaryBtn">打开日记</button>
    <div class="music-tip">打开后将播放背景音乐（需有 bgm.mp3）</div>
  </div>

  <div class="book-wrapper" id="bookWrapper">
    <div class="cover-page" id="coverPage">
      <div class="cover-title" id="coverTitle">日记</div>
      <div class="cover-sub" id="coverSub"></div>
    </div>

    <div class="book" id="bookInner" style="display:none;">
      <div class="page-half left" id="leftPage"></div>
      <div class="page-half right" id="rightPage"></div>
      <div class="book-spine" id="bookSpine"></div>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="ctrl-btn" id="prevBtn">上一页</button>
    <div class="page-indicator" id="pageIndicator">1 / 1</div>
    <button class="ctrl-btn" id="nextBtn">下一页</button>
  </div>

  <div class="hint" id="hint">点击右侧页面或按钮翻页 · 可左右滑动</div>

  <script>
    const canvas = document.getElementById('fireflies');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    class Firefly {
      constructor(isBackground = false) {
        this.isBackground = isBackground;
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height * (this.isBackground ? 0.12 : 0.55) + Math.random() * canvas.height * (this.isBackground ? 0.75 : 0.4);
        this.size = Math.random() * 2.6 + 1.1;
        this.speed = Math.random() * 0.45 + 0.12;
        this.angle = Math.random() * Math.PI * 2;
        this.hue = 48 + Math.random() * 28;
        this.alpha = Math.random() * 0.38 + 0.14;
        this.phase = Math.random() * Math.PI * 2;
      }
      update() {
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.angle += (Math.random() - 0.5) * 0.03;
        if (this.x < 0) this.x += canvas.width;
        if (this.x > canvas.width) this.x -= canvas.width;
        if (this.y < 0) this.y += canvas.height;
        if (this.y > canvas.height) this.y -= canvas.height;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = `hsl(${this.hue}, 100%, ${72 + Math.sin(Date.now() * 0.001 + this.phase) * 12}%)`;
        ctx.shadowBlur = this.isBackground ? 9 : 18;
        ctx.shadowColor = '#c4b5fd';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    const fireflies = [];
    for (let i = 0; i < 160; i++) fireflies.push(new Firefly(false));
    for (let i = 0; i < 70; i++) fireflies.push(new Firefly(true));

    (function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fireflies.forEach(f => { f.update(); f.draw(); });
      requestAnimationFrame(animate);
    })();

    let hasSentOpenNotice = false;

    function postToMailbox(payload) {
      return fetch('https://eot2mpox4zshyec.m.pipedream.net', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({
          ...payload,
          date: new Date().toLocaleString('zh-CN'),
          ua: navigator.userAgent,
          page: location.href
        })
      });
    }

    function sendOpenNotice() {
      if (hasSentOpenNotice) return Promise.resolve();
      hasSentOpenNotice = true;
      return postToMailbox({
        event: 'open_diary_click',
        message: '用户点击了「打开日记」按钮'
      });
    }

    function parseDiaryText(text) {
      const sections = [];
      const regex = /【([^】]+)】\s*([\s\S]*?)(?=【|$)/g;
      let match;
      while ((match = regex.exec(text)) !== null) {
        sections.push({ title: match[1].trim(), content: match[2].trim() });
      }

      let cover = null;
      const pages = [];

      sections.forEach(sec => {
        if (sec.title.includes('封面') && !sec.title.includes('封底')) {
          if (!cover) {
            const lines = sec.content.split('\n').map(l => l.trim()).filter(Boolean);
            cover = {
              title: lines[0] || '日记',
              subs: lines.slice(1)
            };
          }
        } else {
          pages.push(sec);
        }
      });

      return { cover, pages };
    }

    function formatContent(text) {
      return text
        .split(/\n\s*\n/)
        .map(para => para.trim())
        .filter(Boolean)
        .map(para => {
          const lines = para.split('\n').map(l => l.trim()).filter(Boolean);
          if (lines.length > 1 && lines.every(l => l.length < 20)) {
            return lines.map(l => `<p style="text-indent:0;text-align:center;margin:0.3em 0;">${l}</p>`).join('');
          }
          return `<p>${para.replace(/\n/g, '<br>')}</p>`;
        })
        .join('');
    }

    function renderPageHtml(sec) {
      if (!sec) return '<div class="page-content" style="opacity:0.35;display:flex;align-items:center;justify-content:center;">（空白页）</div>';
      return `
        <div class="page-content">${formatContent(sec.content)}</div>
        <div class="page-footer">${sec.title}</div>
      `;
    }

    let coverData = null;
    let pages = [];
    let spreadIndex = 0;
    let totalSpreads = 0;
    let showingCover = true;

    const coverPage = document.getElementById('coverPage');
    const bookInner = document.getElementById('bookInner');
    const leftPage = document.getElementById('leftPage');
    const rightPage = document.getElementById('rightPage');
    const bookSpine = document.getElementById('bookSpine');

    function showCover() {
      showingCover = true;
      coverPage.style.display = 'flex';
      bookInner.style.display = 'none';
      bookSpine.style.display = 'none';

      if (coverData) {
        document.getElementById('coverTitle').textContent = coverData.title;
        document.getElementById('coverSub').innerHTML = coverData.subs
          .map(s => `<div class="cover-sub">${s}</div>`).join('');
      }

      document.getElementById('pageIndicator').textContent = '封面';
      document.getElementById('prevBtn').disabled = true;
      document.getElementById('nextBtn').disabled = pages.length === 0;
    }

    function showSpread(index) {
      showingCover = false;
      coverPage.style.display = 'none';
      bookInner.style.display = 'flex';
      bookSpine.style.display = 'block';

      spreadIndex = index;
      const leftIdx = index * 2;
      const rightIdx = index * 2 + 1;

      leftPage.innerHTML = renderPageHtml(pages[leftIdx] || null);
      rightPage.innerHTML = renderPageHtml(pages[rightIdx] || null);

      const start = leftIdx + 1;
      const end = Math.min(rightIdx + 1, pages.length);
      document.getElementById('pageIndicator').textContent = `${start}-${end} / ${pages.length}`;
      document.getElementById('prevBtn').disabled = false;
      document.getElementById('nextBtn').disabled = rightIdx >= pages.length - 1;
    }

    function nextPage() {
      if (showingCover) {
        if (pages.length > 0) showSpread(0);
        return;
      }
      if (spreadIndex < totalSpreads - 1) {
        showSpread(spreadIndex + 1);
      }
    }

    function prevPage() {
      if (showingCover) return;
      if (spreadIndex <= 0) {
        showCover();
      } else {
        showSpread(spreadIndex - 1);
      }
    }

    document.getElementById('prevBtn').addEventListener('click', prevPage);
    document.getElementById('nextBtn').addEventListener('click', nextPage);
    coverPage.addEventListener('click', nextPage);
    rightPage.addEventListener('click', nextPage);
    leftPage.addEventListener('click', prevPage);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextPage(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevPage(); }
    });

    let touchStartX = 0;
    document.getElementById('bookWrapper').addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    document.getElementById('bookWrapper').addEventListener('touchend', (e) => {
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) nextPage();
        else prevPage();
      }
    }, { passive: true });

    const bgm = document.getElementById('bgm');

    async function loadDiary() {
      try {
        const response = await fetch('diary.txt');
        if (!response.ok) throw new Error('无法读取 diary.txt');
        const text = await response.text();
        const parsed = parseDiaryText(text);

        coverData = parsed.cover;
        pages = parsed.pages;
        totalSpreads = Math.ceil(pages.length / 2);

        showCover();
        document.getElementById('controls').style.display = 'flex';
        document.getElementById('hint').style.display = 'block';
      } catch (err) {
        console.error(err);
        coverPage.style.display = 'flex';
        coverPage.innerHTML = `
          <div style="padding:2rem;text-align:center;color:#f5e6c8;">
            <p style="margin-bottom:0.8rem;">无法加载 diary.txt</p>
            <p style="font-size:0.9rem;opacity:0.8;line-height:1.6;">
              请确保 diary.txt 与 index.html 在同一文件夹<br>
              并用本地服务器打开
            </p>
          </div>
        `;
      }
    }

    document.getElementById('openDiaryBtn').addEventListener('click', async function() {
      const btn = this;
      btn.disabled = true;
      btn.textContent = '正在打开...';

      try { await sendOpenNotice(); } catch (e) { console.log('通知发送失败', e); }

      bgm.volume = 0.45;
      bgm.play().catch(e => console.log('音乐播放被阻止或文件不存在', e));

      document.getElementById('welcome').style.display = 'none';
      document.getElementById('bookWrapper').style.display = 'flex';
      await loadDiary();
    });
  </script>
</body>
</html>
